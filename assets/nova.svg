<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-nova" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0826" />
      <stop offset="50%" stop-color="#140c42" />
      <stop offset="100%" stop-color="#030014" />
    </linearGradient>
    <linearGradient id="glow-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg-nova)" />
  
  <!-- Neural Network Constellation -->
  <g opacity="0.3">
    <circle cx="200" cy="150" r="3" fill="#00f2fe" />
    <circle cx="280" cy="220" r="4" fill="#ff007f" />
    <circle cx="400" cy="120" r="5" fill="#00f2fe" />
    <circle cx="520" cy="240" r="4" fill="#7928ca" />
    <circle cx="620" cy="160" r="3" fill="#00f2fe" />
    <circle cx="400" cy="320" r="4" fill="#00ffcc" />
    <line x1="200" y1="150" x2="280" y2="220" stroke="#00f2fe" stroke-width="1.5" />
    <line x1="280" y1="220" x2="400" y2="120" stroke="#7928ca" stroke-width="1.5" />
    <line x1="400" y1="120" x2="520" y2="240" stroke="#00f2fe" stroke-width="1.5" />
    <line x1="520" y1="240" x2="620" y2="160" stroke="#ff007f" stroke-width="1.5" />
    <line x1="280" y1="220" x2="400" y2="320" stroke="#00ffcc" stroke-width="1.5" />
    <line x1="520" y1="240" x2="400" y2="320" stroke="#00f2fe" stroke-width="1.5" />
  </g>

  <!-- Central AI Core Hologram -->
  <circle cx="400" cy="225" r="90" fill="none" stroke="#00f2fe" stroke-width="2" stroke-dasharray="8 6" opacity="0.8" filter="url(#neon-glow)" />
  <circle cx="400" cy="225" r="65" fill="none" stroke="#ff007f" stroke-width="2" opacity="0.6" />
  <circle cx="400" cy="225" r="40" fill="url(#glow-cyan)" opacity="0.9" filter="url(#neon-glow)" />
  
  <text x="400" y="233" font-family="'Orbitron', sans-serif" font-size="24" font-weight="900" fill="#030014" text-anchor="middle" letter-spacing="2">AI</text>
  <text x="400" y="380" font-family="'Orbitron', sans-serif" font-size="22" font-weight="700" fill="#00f2fe" text-anchor="middle" letter-spacing="4" filter="url(#neon-glow)">NOVAAI ENGINE</text>
</svg>
