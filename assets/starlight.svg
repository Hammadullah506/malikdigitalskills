<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-starlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d112e" />
      <stop offset="50%" stop-color="#0a0521" />
      <stop offset="100%" stop-color="#030014" />
    </linearGradient>
    <linearGradient id="multi-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
    <filter id="glow-star" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg-starlight)" />

  <!-- Dynamic Star Burst -->
  <g transform="translate(400, 200)">
    <path d="M 0 -80 L 18 -20 L 80 0 L 18 20 L 0 80 L -18 20 L -80 0 L -18 -20 Z" fill="url(#multi-grad)" filter="url(#glow-star)" />
    <circle cx="0" cy="0" r="14" fill="#ffffff" />
  </g>

  <text x="400" y="380" font-family="'Orbitron', sans-serif" font-size="22" font-weight="700" fill="#00f2fe" text-anchor="middle" letter-spacing="4" filter="url(#glow-star)">STARLIGHT STUDIO</text>
</svg>
