<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-aetheria" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05051a" />
      <stop offset="50%" stop-color="#1f0933" />
      <stop offset="100%" stop-color="#030014" />
    </linearGradient>
    <linearGradient id="planet-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg-aetheria)" />

  <!-- 3D Spatial Wireframe Grid -->
  <g opacity="0.25" stroke="#00f2fe" stroke-width="1">
    <line x1="100" y1="350" x2="700" y2="350" />
    <line x1="150" y1="380" x2="650" y2="380" />
    <line x1="200" y1="410" x2="600" y2="410" />
    <line x1="400" y1="200" x2="100" y2="450" />
    <line x1="400" y1="200" x2="250" y2="450" />
    <line x1="400" y1="200" x2="400" y2="450" />
    <line x1="400" y1="200" x2="550" y2="450" />
    <line x1="400" y1="200" x2="700" y2="450" />
  </g>

  <!-- Celestial Planet with Orbital Rings -->
  <ellipse cx="400" cy="200" rx="140" ry="40" fill="none" stroke="#00f2fe" stroke-width="2.5" opacity="0.7" transform="rotate(-15 400 200)" filter="url(#glow)" />
  <circle cx="400" cy="200" r="70" fill="url(#planet-grad)" filter="url(#glow)" />
  <ellipse cx="400" cy="200" rx="170" ry="50" fill="none" stroke="#ff007f" stroke-width="1.5" opacity="0.5" stroke-dasharray="10 8" transform="rotate(-15 400 200)" />

  <text x="400" y="380" font-family="'Orbitron', sans-serif" font-size="22" font-weight="700" fill="#ff007f" text-anchor="middle" letter-spacing="4" filter="url(#glow)">AETHERIA 3D METAVERSE</text>
</svg>
