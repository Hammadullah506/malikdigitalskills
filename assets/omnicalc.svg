<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-omnicalc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07071f" />
      <stop offset="50%" stop-color="#140f3c" />
      <stop offset="100%" stop-color="#040212" />
    </linearGradient>

    <!-- Neon Glow Gradients -->
    <linearGradient id="grad-violet-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#00ffcc" />
    </linearGradient>

    <linearGradient id="grad-cyan-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="grad-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb703" />
      <stop offset="100%" stop-color="#fb8500" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="calc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="intense-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#bg-omnicalc)" />

  <!-- Coordinate Grid & Graph Rays -->
  <g opacity="0.18">
    <line x1="80" y1="60" x2="720" y2="60" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="4 6" />
    <line x1="80" y1="120" x2="720" y2="120" stroke="#00f2fe" stroke-width="1" stroke-dasharray="4 6" />
    <line x1="80" y1="180" x2="720" y2="180" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="4 6" />
    <line x1="80" y1="240" x2="720" y2="240" stroke="#00f2fe" stroke-width="1.5" />
    <line x1="80" y1="300" x2="720" y2="300" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="4 6" />
    <line x1="80" y1="360" x2="720" y2="360" stroke="#00f2fe" stroke-width="1" stroke-dasharray="4 6" />
    
    <line x1="160" y1="40" x2="160" y2="390" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="4 6" />
    <line x1="280" y1="40" x2="280" y2="390" stroke="#00f2fe" stroke-width="1" stroke-dasharray="4 6" />
    <line x1="400" y1="40" x2="400" y2="390" stroke="#00ffcc" stroke-width="1.5" />
    <line x1="520" y1="40" x2="520" y2="390" stroke="#00f2fe" stroke-width="1" stroke-dasharray="4 6" />
    <line x1="640" y1="40" x2="640" y2="390" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="4 6" />
  </g>

  <!-- Function Graph Waves -->
  <path d="M 80 240 Q 200 80, 320 240 T 560 240 T 720 160" fill="none" stroke="url(#grad-cyan-blue)" stroke-width="2.5" opacity="0.6" filter="url(#calc-glow)" />
  <path d="M 80 270 Q 220 370, 360 250 T 600 220 T 720 310" fill="none" stroke="#8b5cf6" stroke-width="1.8" stroke-dasharray="6 6" opacity="0.5" />

  <!-- Floating Mathematical & Code Constants -->
  <g font-family="'Space Grotesk', 'Courier New', monospace" font-size="14" fill="#00f2fe" opacity="0.45">
    <text x="110" y="90">f(x) = sin(x)·e^x</text>
    <text x="610" y="90">0x7FFF_FFFF</text>
    <text x="105" y="340">EMI = [P·r·(1+r)^n]</text>
    <text x="625" y="340">λ = 2.71828...</text>
    <text x="140" y="210">∫ e^(-x²) dx</text>
    <text x="640" y="210">64-BIT BIN</text>
  </g>

  <!-- Central Futuristic HUD Calculator Unit -->
  <g transform="translate(400, 195)">
    <!-- Outer Holographic Orbital Ring -->
    <circle cx="0" cy="0" r="120" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="14 10" opacity="0.6" filter="url(#calc-glow)" />
    <circle cx="0" cy="0" r="95" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.7" />
    
    <!-- Calculator Body Container -->
    <rect x="-85" y="-95" width="170" height="190" rx="18" fill="#0c0926" stroke="url(#grad-violet-cyan)" stroke-width="2" filter="url(#calc-glow)" opacity="0.95" />
    
    <!-- Screen Display -->
    <rect x="-70" y="-80" width="140" height="42" rx="8" fill="#040212" stroke="#00f2fe" stroke-width="1" opacity="0.9" />
    <text x="60" y="-66" font-family="'Space Grotesk', monospace" font-size="9" fill="#8b5cf6" text-anchor="end" opacity="0.8">RAD • 2D GRAPH</text>
    <text x="60" y="-46" font-family="'Orbitron', monospace" font-size="16" font-weight="700" fill="#00ffcc" text-anchor="end" filter="url(#calc-glow)">3.14159265</text>
    
    <!-- Keypad Matrix Grid (4x3 glowing buttons) -->
    <!-- Row 1 -->
    <rect x="-70" y="-26" width="28" height="20" rx="5" fill="rgba(139, 92, 246, 0.2)" stroke="#8b5cf6" stroke-width="1" />
    <text x="-56" y="-12" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" fill="#c4b5fd" text-anchor="middle">sin</text>

    <rect x="-35" y="-26" width="28" height="20" rx="5" fill="rgba(139, 92, 246, 0.2)" stroke="#8b5cf6" stroke-width="1" />
    <text x="-21" y="-12" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" fill="#c4b5fd" text-anchor="middle">cos</text>

    <rect x="0" y="-26" width="28" height="20" rx="5" fill="rgba(139, 92, 246, 0.2)" stroke="#8b5cf6" stroke-width="1" />
    <text x="14" y="-12" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" fill="#c4b5fd" text-anchor="middle">tan</text>

    <rect x="35" y="-26" width="35" height="20" rx="5" fill="rgba(255, 0, 127, 0.25)" stroke="#ff007f" stroke-width="1" />
    <text x="52.5" y="-12" font-family="'Orbitron', sans-serif" font-size="11" font-weight="700" fill="#ff007f" text-anchor="middle">AC</text>

    <!-- Row 2 -->
    <rect x="-70" y="2" width="28" height="20" rx="5" fill="rgba(0, 242, 254, 0.12)" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1" />
    <text x="-56" y="16" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">7</text>

    <rect x="-35" y="2" width="28" height="20" rx="5" fill="rgba(0, 242, 254, 0.12)" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1" />
    <text x="-21" y="16" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">8</text>

    <rect x="0" y="2" width="28" height="20" rx="5" fill="rgba(0, 242, 254, 0.12)" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1" />
    <text x="14" y="16" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">9</text>

    <rect x="35" y="2" width="35" height="20" rx="5" fill="rgba(0, 242, 254, 0.25)" stroke="#00f2fe" stroke-width="1" />
    <text x="52.5" y="16" font-family="'Orbitron', sans-serif" font-size="12" font-weight="700" fill="#00f2fe" text-anchor="middle">÷</text>

    <!-- Row 3 -->
    <rect x="-70" y="30" width="28" height="20" rx="5" fill="rgba(0, 242, 254, 0.12)" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1" />
    <text x="-56" y="44" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>

    <rect x="-35" y="30" width="28" height="20" rx="5" fill="rgba(0, 242, 254, 0.12)" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1" />
    <text x="-21" y="44" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>

    <rect x="0" y="30" width="28" height="20" rx="5" fill="rgba(0, 242, 254, 0.12)" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1" />
    <text x="14" y="44" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>

    <rect x="35" y="30" width="35" height="20" rx="5" fill="rgba(0, 242, 254, 0.25)" stroke="#00f2fe" stroke-width="1" />
    <text x="52.5" y="44" font-family="'Orbitron', sans-serif" font-size="12" font-weight="700" fill="#00f2fe" text-anchor="middle">×</text>

    <!-- Row 4 -->
    <rect x="-70" y="58" width="28" height="22" rx="5" fill="rgba(0, 242, 254, 0.12)" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1" />
    <text x="-56" y="73" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>

    <rect x="-35" y="58" width="28" height="22" rx="5" fill="rgba(0, 242, 254, 0.12)" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1" />
    <text x="-21" y="73" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>

    <rect x="0" y="58" width="28" height="22" rx="5" fill="rgba(0, 242, 254, 0.12)" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1" />
    <text x="14" y="73" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>

    <!-- Equal Button (Accent Highlight) -->
    <rect x="35" y="58" width="35" height="22" rx="5" fill="url(#grad-violet-cyan)" stroke="#00ffcc" stroke-width="1.2" filter="url(#calc-glow)" />
    <text x="52.5" y="74" font-family="'Orbitron', sans-serif" font-size="14" font-weight="900" fill="#040212" text-anchor="middle">=</text>
  </g>

  <!-- Left & Right Mode Tags -->
  <g font-family="'Orbitron', sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">
    <!-- Left Badges -->
    <rect x="70" y="145" width="130" height="24" rx="12" fill="rgba(139, 92, 246, 0.12)" stroke="#8b5cf6" stroke-width="1" />
    <text x="135" y="161" fill="#c4b5fd" text-anchor="middle">SCIENTIFIC</text>

    <rect x="70" y="180" width="130" height="24" rx="12" fill="rgba(0, 242, 254, 0.12)" stroke="#00f2fe" stroke-width="1" />
    <text x="135" y="196" fill="#00f2fe" text-anchor="middle">PROGRAMMER</text>

    <rect x="70" y="215" width="130" height="24" rx="12" fill="rgba(0, 255, 204, 0.12)" stroke="#00ffcc" stroke-width="1" />
    <text x="135" y="231" fill="#00ffcc" text-anchor="middle">FINANCIAL</text>

    <!-- Right Badges -->
    <rect x="600" y="145" width="130" height="24" rx="12" fill="rgba(0, 255, 204, 0.12)" stroke="#00ffcc" stroke-width="1" />
    <text x="665" y="161" fill="#00ffcc" text-anchor="middle">2D GRAPHER</text>

    <rect x="600" y="180" width="130" height="24" rx="12" fill="rgba(0, 242, 254, 0.12)" stroke="#00f2fe" stroke-width="1" />
    <text x="665" y="196" fill="#00f2fe" text-anchor="middle">CONVERTERS</text>

    <rect x="600" y="215" width="130" height="24" rx="12" fill="rgba(255, 183, 3, 0.12)" stroke="#ffb703" stroke-width="1" />
    <text x="665" y="231" fill="#ffb703" text-anchor="middle">AUDIO SYNTH</text>
  </g>

  <!-- Title & Subtitle Banner -->
  <text x="400" y="380" font-family="'Orbitron', sans-serif" font-size="22" font-weight="900" fill="#00f2fe" text-anchor="middle" letter-spacing="4" filter="url(#intense-glow)">OMNICALC PRO</text>
  <text x="400" y="405" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="2">MATHEMATICAL, SCIENTIFIC &amp; FINANCIAL SUITE</text>
</svg>
