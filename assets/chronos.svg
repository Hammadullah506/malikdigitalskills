<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-chronos" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14072b" />
      <stop offset="50%" stop-color="#0a0521" />
      <stop offset="100%" stop-color="#030014" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb703" />
      <stop offset="100%" stop-color="#fb8500" />
    </linearGradient>
    <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg-chronos)" />

  <!-- Radar Telemetry Scope & Waveforms -->
  <circle cx="400" cy="200" r="110" fill="none" stroke="#ffb703" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.4" />
  <circle cx="400" cy="200" r="75" fill="none" stroke="#ffb703" stroke-width="2" opacity="0.6" />
  <line x1="400" y1="80" x2="400" y2="320" stroke="#ffb703" stroke-width="1" opacity="0.4" />
  <line x1="280" y1="200" x2="520" y2="200" stroke="#ffb703" stroke-width="1" opacity="0.4" />
  
  <path d="M 280 230 Q 340 160 400 200 T 520 180" fill="none" stroke="#00f2fe" stroke-width="2.5" filter="url(#glow-gold)" />
  <circle cx="400" cy="200" r="12" fill="url(#gold-grad)" filter="url(#glow-gold)" />

  <text x="400" y="380" font-family="'Orbitron', sans-serif" font-size="22" font-weight="700" fill="#ffb703" text-anchor="middle" letter-spacing="4" filter="url(#glow-gold)">CHRONOS NEXUS DEVOPS</text>
</svg>
