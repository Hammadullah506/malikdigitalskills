<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-malik" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05081f" />
      <stop offset="50%" stop-color="#0c1a45" />
      <stop offset="100%" stop-color="#030014" />
    </linearGradient>
    <linearGradient id="grad-cyan-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00ffcc" />
    </linearGradient>
    <linearGradient id="grad-gold-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb703" />
      <stop offset="100%" stop-color="#fb8500" />
    </linearGradient>
    <filter id="glow-effect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#bg-malik)" />

  <!-- Geometric Grid & Constellation Rays -->
  <g opacity="0.25">
    <line x1="100" y1="50" x2="700" y2="50" stroke="#00f2fe" stroke-width="1" stroke-dasharray="6 6" />
    <line x1="100" y1="400" x2="700" y2="400" stroke="#00f2fe" stroke-width="1" stroke-dasharray="6 6" />
    <line x1="100" y1="50" x2="100" y2="400" stroke="#00f2fe" stroke-width="1" stroke-dasharray="6 6" />
    <line x1="700" y1="50" x2="700" y2="400" stroke="#00f2fe" stroke-width="1" stroke-dasharray="6 6" />
    <line x1="400" y1="50" x2="400" y2="400" stroke="#00ffcc" stroke-width="1" stroke-dasharray="4 8" />
  </g>

  <!-- Constellation Nodes (Skills Network) -->
  <g opacity="0.5">
    <circle cx="180" cy="140" r="4" fill="#00f2fe" filter="url(#glow-effect)" />
    <circle cx="240" cy="220" r="5" fill="#ffb703" filter="url(#glow-effect)" />
    <circle cx="620" cy="140" r="4" fill="#00ffcc" filter="url(#glow-effect)" />
    <circle cx="560" cy="220" r="5" fill="#00f2fe" filter="url(#glow-effect)" />
    <line x1="180" y1="140" x2="240" y2="220" stroke="#00f2fe" stroke-width="1.5" />
    <line x1="240" y1="220" x2="330" y2="225" stroke="#ffb703" stroke-width="1.5" />
    <line x1="620" y1="140" x2="560" y2="220" stroke="#00ffcc" stroke-width="1.5" />
    <line x1="560" y1="220" x2="470" y2="225" stroke="#00f2fe" stroke-width="1.5" />
  </g>

  <!-- Central Holographic Orbital Rings -->
  <circle cx="400" cy="210" r="110" fill="none" stroke="#00f2fe" stroke-width="2" stroke-dasharray="12 8" opacity="0.6" filter="url(#glow-effect)" />
  <circle cx="400" cy="210" r="85" fill="none" stroke="#00ffcc" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.7" />
  <circle cx="400" cy="210" r="60" fill="rgba(0, 242, 254, 0.08)" stroke="#ffb703" stroke-width="2" filter="url(#glow-effect)" />

  <!-- Center Icon: Graduation Cap & Code Terminal Symbol -->
  <g transform="translate(400, 205) scale(1.1)" filter="url(#glow-effect)">
    <!-- Graduation Cap -->
    <path d="M 0 -28 L 32 -14 L 0 0 L -32 -14 Z" fill="url(#grad-cyan-blue)" />
    <path d="M -22 -8 L -22 12 C -22 22 22 22 22 12 L 22 -8" fill="none" stroke="#00f2fe" stroke-width="2.5" />
    <path d="M 28 -12 L 28 14 C 28 17 32 17 32 14 L 32 -12" fill="none" stroke="#ffb703" stroke-width="2" />
    
    <!-- Code Brackets in Core -->
    <text x="0" y="16" font-family="'Orbitron', sans-serif" font-size="16" font-weight="900" fill="#00ffcc" text-anchor="middle">&lt;/&gt;</text>
  </g>

  <!-- Skill Badges Floating -->
  <g font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600">
    <!-- Badge 1: 11+ Courses -->
    <rect x="130" y="270" width="130" height="30" rx="15" fill="rgba(0, 242, 254, 0.15)" stroke="#00f2fe" stroke-width="1" />
    <text x="195" y="290" fill="#00f2fe" text-anchor="middle">★ 11+ COURSES</text>

    <!-- Badge 2: 500+ Students -->
    <rect x="540" y="270" width="140" height="30" rx="15" fill="rgba(0, 255, 204, 0.15)" stroke="#00ffcc" stroke-width="1" />
    <text x="610" y="290" fill="#00ffcc" text-anchor="middle">⚡ 500+ STUDENTS</text>
  </g>

  <!-- Title & Subtitle Banner -->
  <text x="400" y="365" font-family="'Orbitron', sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4" filter="url(#glow-effect)">
    MALIK DIGITAL SKILLS
  </text>
  <text x="400" y="395" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600" fill="#00f2fe" text-anchor="middle" letter-spacing="3">
    EDTECH &amp; DIGITAL TRAINING PLATFORM
  </text>
</svg>
