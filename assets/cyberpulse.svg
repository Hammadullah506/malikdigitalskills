<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-cyber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0026" />
      <stop offset="50%" stop-color="#0a0521" />
      <stop offset="100%" stop-color="#030014" />
    </linearGradient>
    <filter id="glow-magenta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg-cyber)" />

  <!-- Isometric Block & Blockchain Chain -->
  <g opacity="0.8" transform="translate(400, 190)">
    <!-- Central Cube -->
    <polygon points="0,-60 60,-25 0,10 -60,-25" fill="#ff007f" opacity="0.8" filter="url(#glow-magenta)" />
    <polygon points="-60,-25 0,10 0,80 -60,45" fill="#7928ca" opacity="0.9" />
    <polygon points="0,10 60,-25 60,45 0,80" fill="#00f2fe" opacity="0.85" />
  </g>

  <text x="400" y="380" font-family="'Orbitron', sans-serif" font-size="22" font-weight="700" fill="#ff007f" text-anchor="middle" letter-spacing="4" filter="url(#glow-magenta)">CYBERPULSE WEB3</text>
</svg>
